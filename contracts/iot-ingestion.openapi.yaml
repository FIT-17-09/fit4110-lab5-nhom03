openapi: 3.1.0
info:
  title: FIT4110 Lab 05 - IoT Ingestion Service
  version: 0.5.0-team-iot
  description: IoT Ingestion API chạy trong Docker Compose, lưu PostgreSQL và gọi mock AI service.
servers:
  - url: http://localhost:8000
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check API, DB và AI service
      security: []
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readings:
    post:
      operationId: createReading
      summary: Tạo sensor reading
      responses:
        '201':
          description: Reading accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorReadingCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /readings/latest:
    get:
      operationId: getLatestReadings
      summary: Lấy readings mới nhất
      parameters:
        - name: device_id
          in: query
          required: false
          schema:
            type: [string, 'null']
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Danh sách readings
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SensorReading'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /readings/{reading_id}:
    get:
      operationId: getReadingById
      summary: Lấy chi tiết reading
      parameters:
        - name: reading_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reading detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorReading'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Reading not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationError:
      description: Invalid request payload
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version, db, ai_service]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
        version:
          type: string
        db:
          type: string
          enum: [ok, error]
        ai_service:
          type: string
          enum: [ok, error]
    SensorMetric:
      type: string
      enum: [temperature, humidity, motion, smoke]
    SensorUnit:
      type: string
      enum: [celsius, percent, boolean, ppm]
    SensorReadingCreate:
      type: object
      required: [device_id, metric, value, timestamp]
      properties:
        device_id:
          type: string
          minLength: 3
          example: ESP32-LAB-A01
        metric:
          $ref: '#/components/schemas/SensorMetric'
        value:
          type: number
          minimum: -40
          maximum: 80
          example: 31.5
        unit:
          oneOf:
            - $ref: '#/components/schemas/SensorUnit'
            - type: 'null'
        timestamp:
          type: string
          example: 2026-05-13T08:30:00+07:00
    SensorReadingCreated:
      type: object
      required: [reading_id, device_id, metric, accepted, created_at]
      properties:
        reading_id:
          type: string
        device_id:
          type: string
        metric:
          $ref: '#/components/schemas/SensorMetric'
        accepted:
          type: boolean
        created_at:
          type: string
        ai_result:
          type: [object, 'null']
    SensorReading:
      type: object
      required: [reading_id, device_id, metric, value, timestamp, created_at]
      properties:
        reading_id:
          type: string
        device_id:
          type: string
        metric:
          type: string
        value:
          type: number
        unit:
          type: [string, 'null']
        timestamp:
          type: string
        created_at:
          type: string
        ai_result:
          type: [object, 'null']
    ProblemDetails:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: [string, 'null']
